# Server backends for vd's live-verification test suite.
#
# Brings up one container per server-backed vd backend. The pytest suite
# (see conftest.py) TCP-probes each port and runs the contract tests against
# whatever is reachable; backends whose container is down are skipped, so the
# suite stays green in a plain CI environment.
#
#   docker compose -f tests/docker-compose.yml up -d      # start
#   pytest tests/                                         # run the suite
#   docker compose -f tests/docker-compose.yml down -v    # stop + wipe
#
# milvus is intentionally absent: the milvus adapter is verified against the
# embedded Milvus Lite engine (no server), which exercises the same code path.
#
# No accounts needed: pinecone runs as Pinecone Local (the official in-memory
# emulator) and mongodb as MongoDB Atlas Local. turbopuffer has no emulator.
#
# Docker Hub rate-limits anonymous pulls. Set DOCKERHUB_MIRROR=mirror.gcr.io
# (Google's public Docker Hub mirror) to pull the Docker Hub images from there:
#   DOCKERHUB_MIRROR=mirror.gcr.io docker compose -f tests/docker-compose.yml up -d

services:
  pgvector:
    image: ${DOCKERHUB_MIRROR:-docker.io}/pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: vd
      POSTGRES_PASSWORD: vd
      POSTGRES_DB: vd
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vd"]
      interval: 3s
      timeout: 5s
      retries: 20

  redis:
    image: ${DOCKERHUB_MIRROR:-docker.io}/redis/redis-stack-server:latest
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 5s
      retries: 20

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.0.3
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  weaviate:
    image: ${DOCKERHUB_MIRROR:-docker.io}/semitechnologies/weaviate:1.28.4
    command: ["--host", "0.0.0.0", "--port", "8080", "--scheme", "http"]
    environment:
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: "/var/lib/weaviate"
      DEFAULT_VECTORIZER_MODULE: "none"
      ENABLE_MODULES: ""
      QUERY_DEFAULTS_LIMIT: "25"
    ports:
      - "8080:8080"
      - "50051:50051"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/v1/.well-known/ready || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  mongodb:
    image: ${DOCKERHUB_MIRROR:-docker.io}/mongodb/mongodb-atlas-local:latest
    # Host port 27018 (not 27017) to avoid colliding with a developer's
    # native mongod. The container still listens on 27017 internally.
    ports:
      - "27018:27017"
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.runCommand({ ping: 1 })' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  qdrant:
    # The qdrant adapter with url= (the "qdrant_server" test entry). Embedded
    # qdrant needs no container and is always tested.
    image: ${DOCKERHUB_MIRROR:-docker.io}/qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"

  pinecone:
    # Pinecone Local: in-memory, no account (api_key="pclocal"). It speaks the
    # pre-2026-07 API, so run the pinecone tests with the pinecone SDK < 10.
    image: ghcr.io/pinecone-io/pinecone-local:latest
    environment:
      PORT: "5080"
      PINECONE_HOST: localhost
    ports:
      - "5080-5090:5080-5090"
